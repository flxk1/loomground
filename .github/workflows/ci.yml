name: ci
on:
  push:
  pull_request:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE / SPDX licensing compliance
        uses: fsfe/reuse-action@v5

  llms-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: llms.txt stays in sync with the language
        run: python3 tools/check_llms_txt.py

  lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: every feature reaches grammar, schema, and a vector
        run: python3 tests/lockstep_meta_test.py

  skill-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: the skill is generated from the language and cannot drift
        run: python3 skills/loomground/make_skill.py --check

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: CATALOGUE.json is the CATALOGUE.md tree as data and cannot drift
        run: python3 tools/check_catalogue.py

  releases:
    runs-on: ubuntu-latest
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: every catalogued repository at its pushed main, tags fetched (private ones skipped)
        run: |
          mkdir -p "$RUNNER_TEMP/siblings"
          for r in $(python3 -c 'import json; print(" ".join(r["repo"] for r in json.load(open("CATALOGUE.json"))["repos"]))'); do
            if git clone -q --depth 1 --branch main "https://github.com/flxk1/$r" "$RUNNER_TEMP/siblings/$r" 2>/dev/null; then
              git -C "$RUNNER_TEMP/siblings/$r" fetch -q --depth 1 origin '+refs/tags/*:refs/tags/*'
            else
              echo "note: $r skipped (private or unreachable)"
            fi
          done
      - name: RELEASES.json is the family's release/pin register and every pin is a release in range
        continue-on-error: false
        run: python3 tools/check_releases.py --siblings "$RUNNER_TEMP/siblings"

  neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: normative documents are tool- and vendor-neutral (CONTRIBUTING.md)
        run: |
          if grep -rniE 'claude|anthropic|openai|chatgpt|gpt-[0-9]|gemini|copilot|codex|llama|mistral|langchain|autogen|crewai|pure.?data|rvnd|loomground-ref' \
               spec/ grammar/ schema/ vocabulary/ conformance/ examples/ skills/ llms.txt language-card.json AGENTS.md \
               README.md NOTICE CITATION.cff CONTRIBUTING.md \
               --exclude-dir=node_modules 2>/dev/null | grep -v 'tree-sitter/src'; then
            echo "vendor/model/framework/implementation reference found — the standard states criteria, not products (CONTRIBUTING.md)"; exit 1
          fi
          echo "normative and prose surfaces are neutral"

  commit-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commit discipline (new commits only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin ${{ github.base_ref }}
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }} -1"
          fi
          bad=0
          git log --no-merges --format='%s' $range | awk 'length($0)>72 {print "subject >72 chars: " $0; bad=1} END {exit bad}' || bad=1
          if git log --no-merges --format='%(trailers)' $range | grep -iE '^Co-Authored-By:.*(claude|codex|openai|anthropic|copilot|gemini)'; then
            echo "AI co-author trailer found — use the assisted line instead (CONTRIBUTING.md)"; bad=1
          fi
          exit $bad
