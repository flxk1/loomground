name: ci
on:
  push:
  pull_request:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE / SPDX licensing compliance
        uses: fsfe/reuse-action@v5

  llms-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: llms.txt stays in sync with the language
        run: python3 check_llms_txt.py

  lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: every feature reaches grammar, schema, and a vector
        run: python3 lockstep_meta_test.py
