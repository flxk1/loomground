version = 1
SPDX-PackageName = "loomground"
SPDX-PackageSupplier = "flxk1"

# License + copyright for files that cannot carry an inline SPDX header
# (JSON has no comment syntax; the .lg vectors are parsed inputs left
# untouched). The rest of the tree declares SPDX headers inline.

[[annotations]]
path = "conformance/vectors/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".gitignore"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "NOTICE"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "schema/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "conformance/manifest.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "vocabulary/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "language-card.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "grammar/tree-sitter/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["llms.txt", "AGENTS.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "proposals/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "skills/loomground/SKILL.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 flxk1"
SPDX-License-Identifier = "Apache-2.0"
